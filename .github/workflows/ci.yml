name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.3" "pytest-cov>=6.0" "ruff>=0.8"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Run tests
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          MARKET_DATA_PROVIDER: synthetic
          APP_ENVIRONMENT: test
        run: pytest -o addopts= --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose --env-file .env.example config --quiet

      - name: Build images
        run: docker compose --env-file .env.example build

      - name: Boot the stack
        run: |
          docker compose --env-file .env.example up -d
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              echo "stack is up"
              break
            fi
            sleep 5
          done

      - name: Health assertions
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/api/v1/health | tee /tmp/health.json
          grep -q '"status":"healthy"' /tmp/health.json || grep -q '"status": "healthy"' /tmp/health.json
          curl -fsS http://127.0.0.1:8081/healthz
          curl -fsS http://127.0.0.1:8081/ | head -c 200

      - name: End-to-end smoke (sync → strategy → backtest → scan)
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          curl -fsS -X POST "$API/market-data/sync" \
            -H 'Content-Type: application/json' \
            -d '{"symbol":"DEMO-AAPL","timeframe":"1d","lookback_days":400}' | tee /tmp/sync.json
          grep -q '"inserted":[1-9]' /tmp/sync.json || grep -q '"inserted": [1-9]' /tmp/sync.json

          cat > /tmp/dsl.json <<'JSON'
          {
            "schema_version": "1.0",
            "strategy": {"id": "ci-test", "name": "CI EMA Cross", "version": "1.0.0"},
            "market": {"asset_classes": ["stock"], "timeframes": ["1d"]},
            "entry": {"long": {"all": [{"op": "crosses_above", "left": "ema20", "right": "ema50"}]}},
            "exit": {"long": {"any": [{"op": "crosses_below", "left": "ema20", "right": "ema50"}]}},
            "risk": {"stop_loss_atr_multiple": 2.0, "take_profit_r_multiple": 2.0},
            "execution": {"fill_model": "next_bar_open", "fee_bps": 10, "slippage_bps": 5, "initial_capital": 10000}
          }
          JSON

          SID=$(curl -fsS -X POST "$API/strategies" -H 'Content-Type: application/json' \
            -d '{"name":"CI Strategy"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          VID=$(curl -fsS -X POST "$API/strategies/$SID/versions" -H 'Content-Type: application/json' \
            -d "$(python3 -c 'import json;print(json.dumps({"version":"1.0.0","dsl":json.load(open("/tmp/dsl.json"))}))')" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "strategy=$SID version=$VID"

          curl -fsS -X POST "$API/backtests" -H 'Content-Type: application/json' \
            -d "{\"strategy_version_id\": $VID, \"symbol\": \"DEMO-AAPL\", \"timeframe\": \"1d\"}" \
            | tee /tmp/backtest.json
          grep -q '"status":"completed"' /tmp/backtest.json || grep -q '"status": "completed"' /tmp/backtest.json

          curl -fsS -X POST "$API/signals/scan" | head -c 400
          echo

      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.example down -v
