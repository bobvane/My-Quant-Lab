name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Scratch PostgreSQL for the trigger regression suite. The unit suite
      # runs on SQLite, but anything that only exists on PostgreSQL (trigger
      # functions, timestamptz behaviour) is invisible there — which is how a
      # broken trigger shipped and 500'd every version creation in production.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantlab_test
          POSTGRES_PASSWORD: quantlab_test
          POSTGRES_DB: quantlab_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U quantlab_test -d quantlab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # httpx2 is test-only: starlette's TestClient prefers it and otherwise
          # emits a StarletteDeprecationWarning on every client-fixture run. The
          # application's own HTTP calls keep using httpx.
          pip install "pytest>=8.3" "pytest-cov>=6.0" "ruff>=0.8" "httpx2>=2.13"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          MARKET_DATA_PROVIDER: synthetic
          APP_ENVIRONMENT: test
        # `--cov-precision=2` is not cosmetic. pytest-cov compares
        # `round(total, precision)` against the floor, and its default precision
        # of 0 rounded 85.96 up to 86 -- so `--cov-fail-under=86` passed while
        # the same run printed "FAIL Required test coverage of 86% not reached.
        # Total coverage: 85.96%". The floor is 85.5, which is exactly the
        # threshold precision 0 was really enforcing, and both halves of the
        # check now read the same number (ADR-105). Measured today: 8178
        # statements, 1148 missed, 85.96%.
        run: pytest -o addopts= --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85.5 --cov-precision=2

      - name: Run PostgreSQL regression tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          TEST_POSTGRES_URL: postgresql+psycopg://quantlab_test:quantlab_test@localhost:5433/quantlab_test
          MARKET_DATA_PROVIDER: synthetic
          APP_ENVIRONMENT: test
        run: pytest -o addopts= tests/test_postgres_triggers.py -v

      - name: Upload coverage
        # `if: always()` is deliberate: the report matters most when the suite failed.
        # The artifact must then really exist -- a missing coverage.xml is a failure of
        # this step, not a quiet skip (ADR-102). The floor above lives in the run step
        # so the number is enforced, not merely printed.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    # Run even when a sibling job failed: the container smoke test is the only
    # place the real startup path is exercised, so it must never be skipped.
    needs: [backend, frontend]
    if: ${{ !cancelled() }}
    # This job boots the stack from `--env-file .env.example`, and that template ships
    # the real provider (`MARKET_DATA_PROVIDER=yahoo_finance`) because it is the file an
    # operator copies. A shell value wins over the env file (ADR-077), so the smoke test
    # pins the deterministic provider for itself: `DEMO-AAPL` has no Yahoo series, which
    # is why the stock template would sync 0 bars and fail `Smoke 1/5` (ADR-172).
    env:
      MARKET_DATA_PROVIDER: synthetic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate compose file
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example config --quiet

      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example build

      - name: Boot the stack
        env:
          APP_ENVIRONMENT: ci
        run: |
          set +e
          # Generated per run (ADR-077): shell values win over --env-file, so the
          # compose file is still read from the stock .env.example.
          export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          export SECRET_KEY="$(openssl rand -hex 32)"
          # The deployment check has to be able to fail this pipeline, so it runs
          # here, where the exported secrets are visible, and never as a separate
          # step whose success could be followed by a failing `up` (ADR-078).
          bash scripts/preflight.sh --env-file .env.example || {
            echo "=== pre-flight refused the deployment ==="
            exit 1
          }
          docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example up -d
          rc=$?
          echo "=== compose up exit code: $rc ==="
          docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example ps -a || true
          echo "=== quantlab-api logs ==="
          docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example logs --no-color --tail 200 quantlab-api || true
          exit $rc

      - name: Wait for health
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:8080/api/v1/healthz >/dev/null 2>&1; then
              ok=1
              echo "stack is up after $((i * 5))s"
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "stack never became healthy"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example ps -a || true
            exit 1
          fi

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          set +e
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          {
            echo "## Container diagnostics"
            echo
            echo '```'
            echo "### compose ps -a"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example ps -a 2>&1
            echo
            echo "### inspect health (quantlab-api)"
            docker inspect --format '{{json .State}}' quantlab-api 2>&1 | head -c 4000
            echo
            echo
            echo "### inside quantlab-api: processes"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example exec -T quantlab-api sh -c 'ps aux 2>&1 || echo "ps unavailable"'
            echo
            echo "### inside quantlab-api: listening sockets"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example exec -T quantlab-api sh -c 'cat /proc/net/tcp 2>&1 | head -20'
            echo
            echo "### inside quantlab-api: is curl present?"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example exec -T quantlab-api sh -c 'command -v curl; curl --version 2>&1 | head -2'
            echo
            echo "### inside quantlab-api: run the healthcheck by hand"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example exec -T quantlab-api sh -c 'curl -v -fsS http://127.0.0.1:8080/api/v1/healthz; echo "curl exit=$?"' 2>&1
            echo
            echo "### inside quantlab-api: can we import the app?"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example exec -T quantlab-api sh -c 'python -c "import app.api.main; print(\"app import OK\")"' 2>&1
            echo
            echo "### inside quantlab-api: alembic current"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example exec -T quantlab-api sh -c 'alembic current 2>&1 | tail -5' 2>&1
            echo
            echo "### quantlab-api logs"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example logs --no-color --tail 300 quantlab-api 2>&1
            echo '```'
          } 2>&1 | tee -a "$SUMMARY"

      - name: Health assertions
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/api/v1/healthz
          curl -fsS http://127.0.0.1:8080/api/v1/health | tee /tmp/health.json
          grep -q '"status":"healthy"' /tmp/health.json || grep -q '"status": "healthy"' /tmp/health.json
          # The container runs `alembic upgrade head` before it serves, so this stack
          # must be able to name its schema revision — not "unknown", not "none"
          # (ADR-071). This is the assertion that makes the field real on a live
          # deployment rather than only in unit tests.
          migration=$(sed -n 's/.*"migration": *"\([^"]*\)".*/\1/p' /tmp/health.json)
          echo "migration=$migration"
          case "$migration" in
            ''|unknown|none|null) echo "the stack cannot name its schema revision"; exit 1 ;;
          esac
          curl -fsS http://127.0.0.1:8081/healthz
          curl -fsS http://127.0.0.1:8081/ | head -c 200

      - name: Web edge assertions (ADR-068)
        run: |
          set -euo pipefail
          WEB=http://127.0.0.1:8081

          # A missing hashed asset is a 404, not the SPA's HTML: a page that
          # asks for a bundle a newer deploy deleted must be told it is missing.
          code=$(curl -sS -o /tmp/missing.out -w '%{http_code}' "$WEB/assets/does-not-exist.js")
          echo "missing asset -> HTTP $code"
          [ "$code" = "404" ] || { echo "expected 404, got $code"; exit 1; }
          if head -c 15 /tmp/missing.out | grep -qi '<!doctype'; then
            echo "a missing asset was answered with the application shell"
            exit 1
          fi

          # The shell is served, revalidated, and links an icon that exists.
          curl -fsS -D /tmp/shell.headers "$WEB/" -o /tmp/shell.html
          grep -qi '^cache-control:.*no-cache' /tmp/shell.headers || {
            echo "index.html is cacheable, so a stale page can outlive its assets"; exit 1; }
          grep -q '/favicon\.svg' /tmp/shell.html || { echo "the shell links no icon"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$WEB/favicon.svg")
          [ "$code" = "200" ] || { echo "favicon.svg -> $code"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$WEB/favicon.ico")
          [ "$code" = "204" ] || { echo "/favicon.ico -> $code, expected 204"; exit 1; }

          # The bundle arrives compressed and may be cached forever.
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/shell.html | head -1)
          [ -n "$asset" ] || { echo "the shell references no bundle"; exit 1; }
          curl -fsS -H 'Accept-Encoding: gzip' -D /tmp/asset.headers -o /tmp/asset.js "$WEB$asset"
          grep -qi '^content-encoding:.*gzip' /tmp/asset.headers || {
            echo "$asset was sent uncompressed"; exit 1; }
          grep -qi '^cache-control:.*immutable' /tmp/asset.headers || {
            echo "$asset is not immutably cacheable"; exit 1; }
          size=$(wc -c < /tmp/asset.js)
          echo "$asset -> $size compressed bytes"
          [ "$size" -lt 1000000 ] || { echo "the compressed bundle is $size bytes"; exit 1; }

          # SPA deep links still fall back to the shell.
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$WEB/signals")
          [ "$code" = "200" ] || { echo "deep link -> $code"; exit 1; }

      - name: "Smoke 1/5: sync market data"
        env:
          APP_ENVIRONMENT: ci
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          code=$(curl -sS -o /tmp/sync.json -w '%{http_code}' -X POST "$API/market-data/sync" \
            -H 'Content-Type: application/json' \
            -d '{"symbol":"DEMO-AAPL","timeframe":"1d","lookback_days":400}')
          echo "HTTP $code"
          cat /tmp/sync.json; echo
          if [ "$code" != "200" ]; then
            echo "--- api logs ---"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example logs --no-color --tail 200 quantlab-api
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/sync.json'));assert d['inserted']>0, d"

      - name: "Smoke 2/5: create strategy"
        env:
          APP_ENVIRONMENT: ci
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          code=$(curl -sS -o /tmp/strategy.json -w '%{http_code}' -X POST "$API/strategies" \
            -H 'Content-Type: application/json' -d '{"name":"CI Strategy"}')
          echo "HTTP $code"
          cat /tmp/strategy.json; echo
          if [ "$code" != "201" ]; then
            echo "--- api logs (server traceback is here) ---"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example logs --no-color --tail 200 quantlab-api
            exit 1
          fi
          SID=$(python3 -c "import json;print(json.load(open('/tmp/strategy.json'))['id'])")
          echo "SID=$SID" >> "$GITHUB_ENV"

      - name: "Smoke 3/5: create strategy version"
        env:
          APP_ENVIRONMENT: ci
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          cat > /tmp/dsl.json <<'JSON'
          {
            "schema_version": "1.0",
            "strategy": {"id": "ci-test", "name": "CI EMA Cross", "version": "1.0.0"},
            "market": {"asset_classes": ["stock"], "timeframes": ["1d"]},
            "entry": {"long": {"all": [{"op": "crosses_above", "left": "ema20", "right": "ema50"}]}},
            "exit": {"long": {"any": [{"op": "crosses_below", "left": "ema20", "right": "ema50"}]}},
            "risk": {"stop_loss_atr_multiple": 2.0, "take_profit_r_multiple": 2.0},
            "execution": {"fill_model": "next_bar_open", "fee_bps": 10, "slippage_bps": 5, "initial_capital": 10000}
          }
          JSON
          payload=$(python3 -c "import json;print(json.dumps({'version':'1.0.0','dsl':json.load(open('/tmp/dsl.json'))}))")
          code=$(curl -sS -o /tmp/version.json -w '%{http_code}' -X POST "$API/strategies/$SID/versions" \
            -H 'Content-Type: application/json' -d "$payload")
          echo "HTTP $code"
          cat /tmp/version.json; echo
          if [ "$code" != "201" ]; then
            echo "--- api logs ---"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example logs --no-color --tail 200 quantlab-api
            exit 1
          fi
          VID=$(python3 -c "import json;print(json.load(open('/tmp/version.json'))['id'])")
          echo "VID=$VID" >> "$GITHUB_ENV"

      - name: "Smoke 4/5: run backtest"
        env:
          APP_ENVIRONMENT: ci
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          code=$(curl -sS -o /tmp/backtest.json -w '%{http_code}' -X POST "$API/backtests" \
            -H 'Content-Type: application/json' \
            -d "{\"strategy_version_id\": $VID, \"symbol\": \"DEMO-AAPL\", \"timeframe\": \"1d\"}")
          echo "HTTP $code"
          head -c 600 /tmp/backtest.json; echo
          if [ "$code" != "200" ]; then
            echo "--- api logs ---"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example logs --no-color --tail 200 quantlab-api
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/backtest.json'));assert d['status']=='completed', d"

      - name: "Smoke 5/5: scan signals"
        env:
          APP_ENVIRONMENT: ci
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          code=$(curl -sS -o /tmp/scan.json -w '%{http_code}' -X POST "$API/signals/scan")
          echo "HTTP $code"
          head -c 400 /tmp/scan.json; echo
          if [ "$code" != "200" ]; then
            echo "--- api logs ---"
            docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example logs --no-color --tail 200 quantlab-api
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/scan.json'));assert isinstance(d['evaluated'],int) and d['evaluated']>=0, d;assert d.get('disclaimer'), d;print('evaluated =', d['evaluated'], '| created =', d['created'])"

      - name: "Exposure assertions (ADR-103/104/106)"
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example"
          API=http://127.0.0.1:8080
          WEB=http://127.0.0.1:8081
          TOKEN=ci-exposure-token-1

          # Two documented claims that nothing ever exercised: WEB_BIND=127.0.0.1
          # really closes the LAN door, and API_AUTH_TOKEN really covers every
          # route the application serves - /docs and /openapi.json included -
          # while the web container keeps presenting it for the browser
          # (ADR-103/104). One recreate, three claims.
          #
          # The stack was created with per-run secrets that only the boot step's
          # shell knew (ADR-077), so recreating these two containers without
          # reading those values back would hand the API the example defaults and
          # lose it the database. They are read out of the running container, and
          # the two overrides are exported rather than written into an env file,
          # because shell values win over --env-file in this repository (ADR-077).
          read_env() {
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' quantlab-api \
              | sed -n "s/^$1=//p" | head -n 1
          }
          export POSTGRES_PASSWORD="$(read_env POSTGRES_PASSWORD)"
          export SECRET_KEY="$(read_env SECRET_KEY)"
          [ -n "$POSTGRES_PASSWORD" ] || { echo "cannot read the password the API is running on"; exit 1; }
          export WEB_BIND=127.0.0.1
          export API_AUTH_TOKEN="$TOKEN"
          # These are the compose service names, and --no-deps keeps the database,
          # the queue and the proxy out of the recreate: a step that named a
          # service which does not exist would fail before its first assertion
          # (ADR-106, and how this step first failed in CI).
          $COMPOSE up -d --no-deps quantlab-api quantlab-web

          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS "$API/api/v1/healthz" >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" -ne 1 ]; then
            echo "the API never answered again after the token was set"
            $COMPOSE logs --no-color --tail 100 quantlab-api
            exit 1
          fi

          # The web container has to bind a port too, and it was recreated a
          # moment ago: an assertion that runs the instant `up -d` returns is
          # testing the scheduler instead of the policy. That is how this step
          # failed once, with the API healthy and nginx still binding:
          # `curl: (56) Recv failure: Connection reset by peer` -> 000, reported
          # as if WEB_BIND had not closed the door (ADR-109).
          web_ok=0
          for _ in $(seq 1 60); do
            if [ "$(curl -sS -o /dev/null -w '%{http_code}' "$WEB/healthz")" = "200" ]; then web_ok=1; break; fi
            sleep 2
          done
          if [ "$web_ok" -ne 1 ]; then
            echo "the web edge never answered on $WEB"
            $COMPOSE logs --no-color --tail 100 quantlab-web
            exit 1
          fi

          code() { curl -sS -o /dev/null -w '%{http_code}' "$1"; }

          # 1. The documented off switch really closes the door: loopback answers,
          #    the machine's own LAN address does not.
          lan=$(hostname -I | awk '{print $1}')
          [ -n "$lan" ] || { echo "no non-loopback address to probe"; exit 1; }
          echo "loopback 8081/healthz -> $(code "$WEB/healthz")"
          [ "$(code "$WEB/healthz")" = "200" ] || { echo "loopback must keep working"; exit 1; }
          if curl -fsS --max-time 5 -o /dev/null "http://$lan:8081/healthz" 2>/dev/null; then
            echo "WEB_BIND=127.0.0.1 did not close http://$lan:8081 (ADR-104)"
            exit 1
          fi
          echo "http://$lan:8081 refused, as documented"

          # 2. Straight on the API port, without the header: the two health probes
          #    answer, everything else - the docs console and the schema included -
          #    does not (ADR-103).
          for path in /docs /openapi.json /api/v1/strategies; do
            got=$(code "$API$path")
            echo "no token  $path -> $got"
            [ "$got" = "401" ] || { echo "$path answered $got without a token"; exit 1; }
          done
          for path in /api/v1/healthz /api/v1/health; do
            got=$(code "$API$path")
            echo "no token  $path -> $got"
            [ "$got" = "200" ] || { echo "$path is no longer exempt"; exit 1; }
          done

          # 3. Through the web container the browser sends nothing and everything
          #    works: the proxy presents the token for /api/, /docs and
          #    /openapi.json alike.
          for path in /docs /openapi.json /api/v1/strategies /healthz; do
            got=$(code "$WEB$path")
            echo "via web   $path -> $got"
            [ "$got" = "200" ] || { echo "$path answered $got through the proxy"; exit 1; }
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.example down -v