name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.3" "pytest-cov>=6.0" "ruff>=0.8"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          MARKET_DATA_PROVIDER: synthetic
          APP_ENVIRONMENT: test
        run: pytest -o addopts= --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    # Run even when a sibling job failed: the container smoke test is the only
    # place the real startup path is exercised, so it must never be skipped.
    needs: [backend, frontend]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate compose file
        run: docker compose --env-file .env.example config --quiet

      - name: Build images
        run: docker compose --env-file .env.example build

      - name: Boot the stack
        env:
          APP_ENVIRONMENT: ci
        run: |
          set +e
          docker compose --env-file .env.example up -d
          rc=$?
          echo "=== compose up exit code: $rc ==="
          docker compose --env-file .env.example ps -a || true
          echo "=== quantlab-api logs ==="
          docker compose --env-file .env.example logs --no-color --tail 200 quantlab-api || true
          exit $rc

      - name: Wait for health
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:8080/api/v1/healthz >/dev/null 2>&1; then
              ok=1
              echo "stack is up after $((i * 5))s"
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "stack never became healthy"
            docker compose --env-file .env.example ps -a || true
            exit 1
          fi

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          set +e
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          {
            echo "## Container diagnostics"
            echo
            echo '```'
            echo "### compose ps -a"
            docker compose --env-file .env.example ps -a 2>&1
            echo
            echo "### inspect health (quantlab-api)"
            docker inspect --format '{{json .State}}' quantlab-api 2>&1 | head -c 4000
            echo
            echo
            echo "### inside quantlab-api: processes"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'ps aux 2>&1 || echo "ps unavailable"'
            echo
            echo "### inside quantlab-api: listening sockets"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'cat /proc/net/tcp 2>&1 | head -20'
            echo
            echo "### inside quantlab-api: is curl present?"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'command -v curl; curl --version 2>&1 | head -2'
            echo
            echo "### inside quantlab-api: run the healthcheck by hand"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'curl -v -fsS http://127.0.0.1:8080/api/v1/healthz; echo "curl exit=$?"' 2>&1
            echo
            echo "### inside quantlab-api: can we import the app?"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'python -c "import app.api.main; print(\"app import OK\")"' 2>&1
            echo
            echo "### inside quantlab-api: alembic current"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'alembic current 2>&1 | tail -5' 2>&1
            echo
            echo "### quantlab-api logs"
            docker compose --env-file .env.example logs --no-color --tail 300 quantlab-api 2>&1
            echo '```'
          } 2>&1 | tee -a "$SUMMARY"

      - name: Health assertions
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/api/v1/healthz
          curl -fsS http://127.0.0.1:8080/api/v1/health | tee /tmp/health.json
          grep -q '"status":"healthy"' /tmp/health.json || grep -q '"status": "healthy"' /tmp/health.json
          curl -fsS http://127.0.0.1:8081/healthz
          curl -fsS http://127.0.0.1:8081/ | head -c 200

      - name: "Smoke 1/5: sync market data"
        env:
          APP_ENVIRONMENT: ci
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          code=$(curl -sS -o /tmp/sync.json -w '%{http_code}' -X POST "$API/market-data/sync" \
            -H 'Content-Type: application/json' \
            -d '{"symbol":"DEMO-AAPL","timeframe":"1d","lookback_days":400}')
          echo "HTTP $code"
          cat /tmp/sync.json; echo
          if [ "$code" != "200" ]; then
            echo "--- api logs ---"
            docker compose --env-file .env.example logs --no-color --tail 200 quantlab-api
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/sync.json'));assert d['inserted']>0, d"

      - name: "Smoke 2/5: create strategy"
        env:
          APP_ENVIRONMENT: ci
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          code=$(curl -sS -o /tmp/strategy.json -w '%{http_code}' -X POST "$API/strategies" \
            -H 'Content-Type: application/json' -d '{"name":"CI Strategy"}')
          echo "HTTP $code"
          cat /tmp/strategy.json; echo
          if [ "$code" != "201" ]; then
            echo "--- api logs (server traceback is here) ---"
            docker compose --env-file .env.example logs --no-color --tail 200 quantlab-api
            exit 1
          fi
          SID=$(python3 -c "import json;print(json.load(open('/tmp/strategy.json'))['id'])")
          echo "SID=$SID" >> "$GITHUB_ENV"

      - name: "Smoke 3/5: create strategy version"
        env:
          APP_ENVIRONMENT: ci
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          cat > /tmp/dsl.json <<'JSON'
          {
            "schema_version": "1.0",
            "strategy": {"id": "ci-test", "name": "CI EMA Cross", "version": "1.0.0"},
            "market": {"asset_classes": ["stock"], "timeframes": ["1d"]},
            "entry": {"long": {"all": [{"op": "crosses_above", "left": "ema20", "right": "ema50"}]}},
            "exit": {"long": {"any": [{"op": "crosses_below", "left": "ema20", "right": "ema50"}]}},
            "risk": {"stop_loss_atr_multiple": 2.0, "take_profit_r_multiple": 2.0},
            "execution": {"fill_model": "next_bar_open", "fee_bps": 10, "slippage_bps": 5, "initial_capital": 10000}
          }
          JSON
          payload=$(python3 -c "import json;print(json.dumps({'version':'1.0.0','dsl':json.load(open('/tmp/dsl.json'))}))")
          code=$(curl -sS -o /tmp/version.json -w '%{http_code}' -X POST "$API/strategies/$SID/versions" \
            -H 'Content-Type: application/json' -d "$payload")
          echo "HTTP $code"
          cat /tmp/version.json; echo
          if [ "$code" != "201" ]; then
            echo "--- api logs ---"
            docker compose --env-file .env.example logs --no-color --tail 200 quantlab-api
            exit 1
          fi
          VID=$(python3 -c "import json;print(json.load(open('/tmp/version.json'))['id'])")
          echo "VID=$VID" >> "$GITHUB_ENV"

      - name: "Smoke 4/5: run backtest"
        env:
          APP_ENVIRONMENT: ci
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          code=$(curl -sS -o /tmp/backtest.json -w '%{http_code}' -X POST "$API/backtests" \
            -H 'Content-Type: application/json' \
            -d "{\"strategy_version_id\": $VID, \"symbol\": \"DEMO-AAPL\", \"timeframe\": \"1d\"}")
          echo "HTTP $code"
          head -c 600 /tmp/backtest.json; echo
          if [ "$code" != "200" ]; then
            echo "--- api logs ---"
            docker compose --env-file .env.example logs --no-color --tail 200 quantlab-api
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/backtest.json'));assert d['status']=='completed', d"

      - name: "Smoke 5/5: scan signals"
        env:
          APP_ENVIRONMENT: ci
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080/api/v1
          code=$(curl -sS -o /tmp/scan.json -w '%{http_code}' -X POST "$API/signals/scan")
          echo "HTTP $code"
          head -c 400 /tmp/scan.json; echo
          if [ "$code" != "200" ]; then
            echo "--- api logs ---"
            docker compose --env-file .env.example logs --no-color --tail 200 quantlab-api
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/scan.json'));print('evaluated =', d['evaluated'])"

      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.example down -v