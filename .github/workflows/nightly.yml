name: nightly

# The nightly image is the "latest of main" set. Two things have to be true of
# it, and neither used to be (ADR-076):
#   1. it is the same image the release pipeline publishes, and the stock
#      compose file alone can start it;
#   2. it is started once, from the registry, before anyone is told it exists.
# The verdict is `scripts/verify-stack.sh`, the same script release.yml calls.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-app

jobs:
  images:
    name: rebuild nightly images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build app (nightly tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.app
          push: true
          tags: ${{ env.APP_IMAGE }}:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: verify the nightly images boot
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the nightly stack and verify it
        env:
          VERSION: nightly
        run: |
          set +e
          set -o pipefail
          # A separate job, on a separate runner: this image has to come back
          # out of the registry, not out of the build cache of the job that made
          # them.
          docker pull "${APP_IMAGE}:${VERSION}"

          # The stock file ships example values. A real deployment generates
          # its own, and the application refuses to serve production with a
          # secret that is published in this repository (ADR-077). Exported
          # values win over --env-file, so the compose file is still used
          # exactly as a NAS would use it.
          export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          export SECRET_KEY="$(openssl rand -hex 32)"

          export MQL_VERSION="${VERSION}"

          docker compose --env-file .env.example up -d
          up_rc=$?

          verify_rc=0
          bash scripts/verify-stack.sh 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/stdout}" || verify_rc=$?

          {
            echo "## Nightly image verification (${VERSION})"
            echo
            echo '```'
            echo "compose up exit: ${up_rc}   verify exit: ${verify_rc}"
            echo
            echo "### compose ps -a"
            docker compose --env-file .env.example ps -a 2>&1
            echo
            echo "### inside quantlab-app: healthcheck by hand"
            docker compose --env-file .env.example exec -T quantlab-app sh -c \
              'curl -v -fsS http://127.0.0.1:8080/api/v1/healthz; echo "curl exit=$?"' 2>&1
            echo
            echo "### inside quantlab-app: alembic current"
            docker compose --env-file .env.example exec -T quantlab-app sh -c 'alembic current 2>&1 | tail -5' 2>&1
            echo
            echo "### quantlab-app logs"
            docker compose --env-file .env.example logs --no-color --tail 300 quantlab-app 2>&1
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

          docker compose --env-file .env.example down -v 2>&1

          if [ "$up_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ]; then
            echo "NIGHTLY_VERIFY_FAILED (compose up exit ${up_rc}, verify exit ${verify_rc})"
            exit 1
          fi
          echo "NIGHTLY_VERIFY_OK"
