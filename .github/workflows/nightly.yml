name: nightly

# The nightly images are the "latest of main" set. Two things have to be true of
# them, and neither used to be (ADR-076):
#   1. they are the same three images the release pipeline publishes -- the proxy
#      image was missing, so `MQL_VERSION=nightly` could never start the stock
#      compose file at all (quantlab-docker-proxy is not behind a profile);
#   2. they are started once, from the registry, before anyone is told they exist.
# The verdict is `scripts/verify-stack.sh`, the same script release.yml calls.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-web
  PROXY_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-docker-proxy

jobs:
  images:
    name: rebuild nightly images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend (nightly tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build proxy (nightly tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.proxy
          push: true
          tags: ${{ env.PROXY_IMAGE }}:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web (nightly tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ env.WEB_IMAGE }}:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: verify the nightly images boot
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the nightly stack and verify it
        env:
          VERSION: nightly
        run: |
          set +e
          set -o pipefail
          # A separate job, on a separate runner: these images have to come back
          # out of the registry, not out of the build cache of the job that made
          # them.
          docker pull "${BACKEND_IMAGE}:${VERSION}"
          docker pull "${WEB_IMAGE}:${VERSION}"
          docker pull "${PROXY_IMAGE}:${VERSION}"

          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-smoke-password/' .env.example
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-smoke-secret-key-0123456789abcdef/' .env.example

          export MQL_VERSION="${VERSION}"

          docker compose --env-file .env.example up -d
          up_rc=$?

          verify_rc=0
          bash scripts/verify-stack.sh 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/stdout}" || verify_rc=$?

          {
            echo "## Nightly image verification (${VERSION})"
            echo
            echo '```'
            echo "compose up exit: ${up_rc}   verify exit: ${verify_rc}"
            echo
            echo "### compose ps -a"
            docker compose --env-file .env.example ps -a 2>&1
            echo
            echo "### inside quantlab-api: healthcheck by hand"
            docker compose --env-file .env.example exec -T quantlab-api sh -c \
              'curl -v -fsS http://127.0.0.1:8080/api/v1/healthz; echo "curl exit=$?"' 2>&1
            echo
            echo "### inside quantlab-api: alembic current"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'alembic current 2>&1 | tail -5' 2>&1
            echo
            echo "### quantlab-api logs"
            docker compose --env-file .env.example logs --no-color --tail 300 quantlab-api 2>&1
            echo
            echo "### quantlab-web logs"
            docker compose --env-file .env.example logs --no-color --tail 200 quantlab-web 2>&1
            echo
            echo "### quantlab-docker-proxy logs"
            docker compose --env-file .env.example logs --no-color --tail 100 quantlab-docker-proxy 2>&1
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

          docker compose --env-file .env.example down -v 2>&1

          if [ "$up_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ]; then
            echo "NIGHTLY_VERIFY_FAILED (compose up exit ${up_rc}, verify exit ${verify_rc})"
            exit 1
          fi
          echo "NIGHTLY_VERIFY_OK"
