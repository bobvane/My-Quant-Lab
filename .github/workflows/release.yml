name: 发布

# 每打一个版本标签，产出两样同号的东西：
#   1. 一个 GitHub Release，附件是部署层的 zip 包；
#   2. 一个 GHCR 上的容器包，里面是同样的文件。
#
# 这个包是「部署层」的快照，不是应用镜像：本仓库不构建运行时要拉取的
# 那些应用镜像。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/bobvane/my-quant-lab

jobs:
  checks:
    name: 校验标签与 VERSION
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 比对 VERSION 与标签
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 VERSION=${version} 不一致（应为 ${expected}）。"
            exit 1
          fi

      - name: 渲染 Compose 文件
        run: |
          set -euo pipefail
          cp .env.example .env
          python3 scripts/bootstrap_env.py >/dev/null
          docker compose config --quiet

  package:
    name: 发布容器包
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/bundle.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bundle
          cache-to: type=gha,mode=max,scope=bundle

      - name: 写入摘要
        run: |
          {
            echo "### 容器包已发布"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Digest：\`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: 创建 GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 打包部署层
        run: |
          set -euo pipefail
          zip -r "my-quant-lab-${{ steps.ver.outputs.version }}.zip" \
            docker-compose.yml .env.example VERSION \
            README.md README_CN.md NOTICE.md AGENTS.md docs scripts \
            -x '*.pyc' -x '__pycache__/*'

      - name: 创建发行版
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: my-quant-lab-*.zip
          body: |
            ## My Quant Lab ${{ github.ref_name }}

            本仓库只有部署层，不含应用源码。应用本身是从固定的上游镜像拉取的，
            部署时不会在这里编译任何东西。

            **下载**：下面的 `my-quant-lab-*.zip` 解压后，按
            [docs/NAS_DEPLOYMENT_CN.md](docs/NAS_DEPLOYMENT_CN.md) 操作。

            **容器包**（内容相同，不可变）：

            ```bash
            docker pull ghcr.io/bobvane/my-quant-lab:${{ steps.ver.outputs.version }}
            docker run --rm ghcr.io/bobvane/my-quant-lab:${{ steps.ver.outputs.version }}
            ```

            **直接检出源码**：

            ```bash
            git clone https://github.com/bobvane/My-Quant-Lab.git
            git checkout ${{ github.ref_name }}
            ```
