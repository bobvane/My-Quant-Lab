name: release

# Tag-driven release: pushes images to GHCR (GitHub Packages) and creates a
# GitHub Release. Version tags follow the project's own scheme:
#   v0.0.1 -> v0.0.2 -> ... -> v0.0.9 -> v0.0.10 -> v0.1.0 -> ...
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v0.0.1)'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-web

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web metadata
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the released images
        id: smoke
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          # Pull the released images and force compose to use them instead of
          # building locally (the repo checkout is used only as config source).
          docker pull "${BACKEND_IMAGE}:${VERSION}"
          docker pull "${WEB_IMAGE}:${VERSION}"

          sed -i "s#^MQL_VERSION=.*#MQL_VERSION=${VERSION}#" .env.example
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-smoke-password/' .env.example
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-smoke-secret-key-0123456789abcdef/' .env.example

          docker compose --env-file .env.example up -d --no-build
          up_rc=$?

          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/healthz >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 5
          done

          {
            echo "## Release smoke test (${VERSION})"
            echo
            echo '```'
            echo "compose up exit: ${up_rc}   healthy: ${healthy}"
            echo
            echo "### compose ps -a"
            docker compose --env-file .env.example ps -a 2>&1
            echo
            echo "### inside quantlab-api: processes"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'ps aux 2>&1' 2>&1
            echo
            echo "### inside quantlab-api: healthcheck by hand"
            docker compose --env-file .env.example exec -T quantlab-api sh -c \
              'curl -v -fsS http://127.0.0.1:8080/api/v1/healthz; echo "curl exit=$?"' 2>&1
            echo
            echo "### inside quantlab-api: app import"
            docker compose --env-file .env.example exec -T quantlab-api sh -c \
              'python -c "import app.api.main; print(\"app import OK\")"' 2>&1
            echo
            echo "### inside quantlab-api: alembic current"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'alembic current 2>&1 | tail -5' 2>&1
            echo
            echo "### quantlab-api logs"
            docker compose --env-file .env.example logs --no-color --tail 300 quantlab-api 2>&1
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

          docker compose --env-file .env.example down -v 2>&1

          if [ "$up_rc" -ne 0 ] || [ "$healthy" -ne 1 ]; then
            echo "SMOKE_TEST_FAILED"
            exit 1
          fi
          echo "SMOKE_TEST_OK"

      - name: Generate release notes
        id: notes
        if: always() && steps.version.outputs.version != ''
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          {
            echo "## My Quant Lab ${version}"
            echo
            echo "Personal quantitative research laboratory — research, backtesting, walk-forward and paper trading. **No auto trading.**"
            echo
            echo "### Docker images (GitHub Packages / GHCR)"
            echo
            echo '```bash'
            echo "docker pull ${BACKEND_IMAGE}:${version}"
            echo "docker pull ${WEB_IMAGE}:${version}"
            echo '```'
            echo
            echo "### Deploy on your NAS"
            echo
            echo '```bash'
            echo "git clone https://github.com/${{ github.repository }}.git"
            echo "cd $(basename "${{ github.repository }}")"
            echo "cp .env.example .env    # then edit POSTGRES_PASSWORD and SECRET_KEY"
            echo "sed -i 's#^MQL_VERSION=.*#MQL_VERSION=${version}#' .env"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "Web UI: http://<nas-ip>:8081 · API docs: http://<nas-ip>:8080/docs"
            echo
            echo "### Notes"
            echo
            echo "- Market data provider defaults to \`synthetic\` (deterministic offline demo data)."
            echo "- Set \`MARKET_DATA_PROVIDER=yahoo_finance\` in \`.env\` for real quotes."
            echo "- AI is optional and advisory; quantitative features work with AI disabled."
          } > release-notes.md
          echo "notes=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # Runs even if the smoke test failed: the images are already published
        # at this point, and withholding the release would leave the user with
        # nothing to deploy while the diagnostics sit unread in the run log.
        if: always() && steps.version.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: My Quant Lab ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
