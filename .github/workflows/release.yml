name: Release

# Every version tag produces two things with the same version number:
#   1. a GitHub Release, with the deployment layer attached as a zip;
#   2. a container package on GHCR holding the same files.
#
# The package is the deployment layer, not the application: this repository
# does not build the application images the stack pulls at runtime.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/bobvane/my-quant-lab

jobs:
  checks:
    name: Check tag against VERSION
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare VERSION with the tag
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION=${version} (expected ${expected})."
            exit 1
          fi

      - name: Validate the compose file
        run: |
          set -euo pipefail
          cp .env.example .env
          python3 scripts/bootstrap_env.py >/dev/null
          docker compose config --quiet

  package:
    name: Publish bundle package
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/bundle.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bundle
          cache-to: type=gha,mode=max,scope=bundle

      - name: Summary
        run: |
          {
            echo "### Package published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        run: |
          set -euo pipefail
          zip -r "my-quant-lab-${{ steps.ver.outputs.version }}.zip" \
            docker-compose.yml .env.example VERSION \
            README.md README_CN.md NOTICE.md docs scripts \
            -x '*.pyc' -x '__pycache__/*'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: my-quant-lab-*.zip
          body: |
            ## My Quant Lab ${{ github.ref_name }}

            Deployment layer only. The application runs from pinned upstream
            images; nothing is built from this repository at deploy time.

            **Download:** `my-quant-lab-*.zip` below — unzip, then follow
            [docs/NAS_DEPLOYMENT_CN.md](docs/NAS_DEPLOYMENT_CN.md).

            **Container package** (same files, immutable):

            ```bash
            docker pull ghcr.io/bobvane/my-quant-lab:${{ steps.ver.outputs.version }}
            docker run --rm ghcr.io/bobvane/my-quant-lab:${{ steps.ver.outputs.version }}
            ```

            **Checked-out copy:**

            ```bash
            git clone https://github.com/bobvane/My-Quant-Lab.git
            git checkout ${{ github.ref_name }}
            ```
