name: release

# Tag-driven release: pushes images to GHCR (GitHub Packages) and creates a
# GitHub Release. Version tags follow the project's own scheme:
#   v0.0.1 -> v0.0.2 -> ... -> v0.0.9 -> v0.0.10 -> v0.1.0 -> ...
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v0.0.1)'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-web
  PROXY_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-docker-proxy

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # A pre-release tag (`v2.5.0-rc.1`) publishes images without publishing a
          # version: it is a candidate for a version, not that version. Decided once,
          # here, and read by the two steps below that must behave differently (ADR-175).
          if [[ "${version#v}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Releasing ${version} (pre-release: images only)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Releasing ${version}"
          fi

      # The version scheme has a guard (`backend/tests/test_release_version_scheme.py`),
      # but it runs on `ci.yml`, which is triggered by pushes to main — never by a tag.
      # So the one event that actually publishes could not see the one check that would
      # have stopped it. Read version.txt here: the tag and the file it releases must
      # agree, and the tag must still look like vX.Y.Z (ADR-091).
      #
      # A pre-release tag never writes back to version.txt (ADR-175). version.txt is the
      # version that has shipped, and a candidate has not shipped — the version scheme's
      # own guard refuses a suffix anyway (ADR-079; `version.sh set v2.5.0-rc.1` exits 2).
      # So the candidate is checked rather than rejected: it must look like
      # `vX.Y.Z-<label>`, and its base must be AHEAD of the released version it is a
      # candidate for. That refuses a tag that is not a version at all, and equally a
      # "candidate" of a version that is already out.
      - name: The tag must agree with version.txt
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${version#v}"
          declared="$(tr -d '[:space:]' < version.txt)"
          declared="${declared#v}"
          if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]$ ]]; then
            if [ "$tag" != "$declared" ]; then
              echo "tag says '$version' but version.txt says '$declared'" >&2
              echo "run 'bash scripts/version.sh set ${version}' before tagging" >&2
              exit 1
            fi
            echo "tag ${version} matches version.txt (${declared})"
          elif [[ "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9])-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            base="${BASH_REMATCH[1]}"
            if [ "$base" = "$declared" ]; then
              echo "pre-release tag '$version' names the released version ${declared}" >&2
              echo "a candidate names the version it is a candidate for, which is not out yet" >&2
              exit 1
            fi
            newest=$(printf '%s\n%s\n' "$declared" "$base" | sort -V | tail -n1)
            if [ "$newest" != "$base" ]; then
              echo "pre-release tag '$version' is behind version.txt (${declared})" >&2
              exit 1
            fi
            echo "pre-release ${version}: images only; version.txt stays ${declared}"
          else
            echo "tag '$version' is not vX.Y.Z, nor vX.Y.Z-<label>; see docs/17 ADR-017" >&2
            exit 1
          fi

      # `latest` must point at the NEWEST release, not at whichever run finished last.
      # Releases are deliberately not serialised (cancel-in-progress: false, so a
      # release is never cancelled), so pushing several tags close together let an
      # older version overwrite `latest` — which silently hands anyone using the
      # default `MQL_VERSION=latest` a stale build. Tagging `latest` is now gated on
      # this version actually being the highest tag.
      #
      # A pre-release never owns `latest` (ADR-175): it is not the newest release, it is
      # a candidate for one. Only stable `vX.Y.Z` tags compete, and only against each
      # other — otherwise `v2.5.0-rc.1` would outrank the `v2.5.0` that follows it, and
      # the default `MQL_VERSION=latest` would freeze on a candidate nobody chose.
      - name: Decide whether this release owns the latest tag
        id: latest
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            echo "tag_latest=false" >> "$GITHUB_OUTPUT"
            echo "${version} is a pre-release; 'latest' stays with the stable releases"
            exit 0
          fi
          highest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]$' | head -n1 || true)
          if [ "$version" = "$highest" ]; then
            echo "tag_latest=true" >> "$GITHUB_OUTPUT"
            echo "${version} is the highest tag (${highest}); it owns 'latest'"
          else
            echo "tag_latest=false" >> "$GITHUB_OUTPUT"
            echo "${version} is below the highest tag (${highest}); 'latest' left untouched"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # `2.5` is the tag a user pins to follow a release line, so only a released version
      # may move it: a candidate publishes `v2.5.0-rc.1` / `2.5.0-rc.1` and nothing else
      # (ADR-175). The `latest` gate reads the flag the same way.
      - name: Backend metadata
        id: backend_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.tag_latest }}

      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web metadata
        id: web_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.tag_latest }}

      - name: Proxy metadata
        id: proxy_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.PROXY_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.tag_latest }}

      - name: Build and push proxy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.proxy
          push: true
          tags: ${{ steps.proxy_meta.outputs.tags }}
          labels: ${{ steps.proxy_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the released images
        id: smoke
        # Deliberately no `continue-on-error` here. On the v1.5.2 release this step
        # printed `SMOKE_TEST_FAILED` -- the images could not boot, because the migration
        # id did not fit `alembic_version.version_num` (ADR-064) -- while the run reported
        # success, and the release page still advertised `docker compose pull && docker
        # compose up -d`. Keeping the publish alive is what the `if: always()` on the
        # notes and release steps is for; the verdict itself must decide the run
        # (ADR-075). That verdict is `scripts/verify-stack.sh`, so the nightly
        # pipeline answers the same question with the same code (ADR-076).
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          set -o pipefail
          # Smoke test the images we just pushed, using the stock production
          # compose file exactly as a NAS would (MQL_VERSION pins the tag).
          docker pull "${BACKEND_IMAGE}:${VERSION}"
          docker pull "${WEB_IMAGE}:${VERSION}"
          docker pull "${PROXY_IMAGE}:${VERSION}"

          # The stock file ships example values. A real deployment generates
          # its own, and the application refuses to serve production with a
          # secret that is published in this repository (ADR-077). Exported
          # values win over --env-file, so the compose file is still used
          # exactly as a NAS would use it.
          export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          export SECRET_KEY="$(openssl rand -hex 32)"

          export MQL_VERSION="${VERSION#v}"

          docker compose --env-file .env.example up -d
          up_rc=$?

          # This step starts the stack and reports on it; the verdict -- API answered,
          # web edge served the application, a missing hashed asset was a 404 -- lives
          # in one script, which the nightly pipeline calls too (ADR-076).
          verify_rc=0
          bash scripts/verify-stack.sh 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/stdout}" || verify_rc=$?

          {
            echo "## Release smoke test (${VERSION})"
            echo
            echo '```'
            echo "compose up exit: ${up_rc}   verify exit: ${verify_rc}"
            echo
            echo "### compose ps -a"
            docker compose --env-file .env.example ps -a 2>&1
            echo
            echo "### inside quantlab-api: processes"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'ps aux 2>&1' 2>&1
            echo
            echo "### inside quantlab-api: healthcheck by hand"
            docker compose --env-file .env.example exec -T quantlab-api sh -c \
              'curl -v -fsS http://127.0.0.1:8080/api/v1/healthz; echo "curl exit=$?"' 2>&1
            echo
            echo "### inside quantlab-api: app import"
            docker compose --env-file .env.example exec -T quantlab-api sh -c \
              'python -c "import app.api.main; print(\"app import OK\")"' 2>&1
            echo
            echo "### inside quantlab-api: alembic current"
            docker compose --env-file .env.example exec -T quantlab-api sh -c 'alembic current 2>&1 | tail -5' 2>&1
            echo
            echo "### quantlab-api logs"
            docker compose --env-file .env.example logs --no-color --tail 300 quantlab-api 2>&1
            echo
            echo "### quantlab-web logs"
            docker compose --env-file .env.example logs --no-color --tail 200 quantlab-web 2>&1
            echo '```'
          } 2>&1 | tee -a "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

          docker compose --env-file .env.example down -v 2>&1

          if [ "$up_rc" -ne 0 ] || [ "$verify_rc" -ne 0 ]; then
            echo "SMOKE_TEST_FAILED (compose up exit ${up_rc}, verify exit ${verify_rc})"
            exit 1
          fi
          echo "SMOKE_TEST_OK"

      - name: Generate release notes
        id: notes
        if: always() && steps.version.outputs.version != ''
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # The verdict travels with the artifact: this step runs `if: always()`, so a
          # reader who never opens the run log must still be told whether the images
          # below were seen to boot (ADR-102).
          smoke="${{ steps.smoke.outcome }}"
          {
            echo "## My Quant Lab ${version}"
            echo
            if [ "${smoke}" = "success" ]; then
              echo "> **Smoke test: passed.** These images booted and served \`scripts/verify-stack.sh\` in this run."
            else
              echo "> **Smoke test: ${smoke:-not run}.** This release was published anyway, but the stack was not seen to boot. Read the \`Smoke test the released images\` step of the release run before deploying, and consider the previous tag."
            fi
            echo
            echo "Personal quantitative research laboratory — research, backtesting, walk-forward and paper trading. **No auto trading.**"
            echo
            echo "### Docker images (GitHub Packages / GHCR)"
            echo
            echo '```bash'
            echo "docker pull ${BACKEND_IMAGE}:${version}"
            echo "docker pull ${WEB_IMAGE}:${version}"
            echo "docker pull ${PROXY_IMAGE}:${version}"
            echo '```'
            echo
            echo "### Deploy on your NAS (2 files only)"
            echo
            echo "No source code needed. Get \`docker-compose.yml\` and"
            echo "\`.env.example\` from the repo root, then:"
            echo
            echo '```bash'
            echo "cp .env.example .env    # then edit POSTGRES_PASSWORD and SECRET_KEY"
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo
            echo "To pin a version instead of latest, set in \`.env\`:"
            echo
            echo '```ini'
            echo "MQL_VERSION=${version}"
            echo '```'
            echo
            echo "Web UI: http://<nas-ip>:8081 · API docs: http://<nas-ip>:8081/docs"
            echo
            echo "### License"
            echo
            echo "MIT — see LICENSE."
            echo
            echo "### Notes"
            echo
            echo "- Market data provider defaults to \`synthetic\` (deterministic offline demo data)."
            echo "- Set \`MARKET_DATA_PROVIDER=yahoo_finance\` in \`.env\` for real quotes."
            echo "- AI is optional and advisory; quantitative features work with AI disabled."
          } > release-notes.md
          echo "notes=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # Runs even if the smoke test failed: the images are already published
        # at this point, and withholding the release would leave the user with
        # nothing to deploy while the diagnostics sit unread in the run log.
        if: always() && steps.version.outputs.version != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: My Quant Lab ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
