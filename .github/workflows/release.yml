name: release

# Tag-driven release: pushes images to GHCR (GitHub Packages) and creates a
# GitHub Release. Version tags follow the project's own scheme:
#   v0.0.1 -> v0.0.2 -> ... -> v0.0.9 -> v0.0.10 -> v0.1.0 -> ...
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v0.0.1)'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/my-quant-lab-web

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web metadata
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the released images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && cd /tmp/smoke
          cp -r "$GITHUB_WORKSPACE/docker" "$GITHUB_WORKSPACE/docker-compose.yml" "$GITHUB_WORKSPACE/.env.example" .
          sed -i "s#ghcr.io/bobvane/my-quant-lab-backend:latest#${BACKEND_IMAGE}:${VERSION}#" docker-compose.yml
          sed -i "s#ghcr.io/bobvane/my-quant-lab-web:latest#${WEB_IMAGE}:${VERSION}#" docker-compose.yml
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-smoke-password/' .env.example
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-smoke-secret-key-0123456789/' .env.example
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example up -d
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8080/api/v1/health
          curl -fsS http://127.0.0.1:8081/healthz
          docker compose --env-file .env.example down -v

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          {
            echo "## My Quant Lab ${version}"
            echo
            echo "Personal quantitative research laboratory — research, backtesting, walk-forward and paper trading. **No auto trading.**"
            echo
            echo "### Docker images (GitHub Packages / GHCR)"
            echo
            echo '```bash'
            echo "docker pull ${BACKEND_IMAGE}:${version}"
            echo "docker pull ${WEB_IMAGE}:${version}"
            echo '```'
            echo
            echo "### Deploy on your NAS"
            echo
            echo '```bash'
            echo "git clone https://github.com/${{ github.repository }}.git"
            echo "cd $(basename "${{ github.repository }}")"
            echo "cp .env.example .env    # then edit POSTGRES_PASSWORD and SECRET_KEY"
            echo "sed -i 's#^MQL_VERSION=.*#MQL_VERSION=${version}#' .env"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "Web UI: http://<nas-ip>:8081 · API docs: http://<nas-ip>:8080/docs"
            echo
            echo "### Notes"
            echo
            echo "- Market data provider defaults to \`synthetic\` (deterministic offline demo data)."
            echo "- Set \`MARKET_DATA_PROVIDER=yahoo_finance\` in \`.env\` for real quotes."
            echo "- AI is optional and advisory; quantitative features work with AI disabled."
          } > release-notes.md
          echo "notes=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: My Quant Lab ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
