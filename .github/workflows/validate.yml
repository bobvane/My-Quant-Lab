name: 校验

# 每次推送都跑一遍：确认 Compose 文件能被真实渲染出来，
# 并且不会悄悄退化成「本地构建镜像」或者「没密码也能启动」。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: 渲染 Compose 文件
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 造一份临时 .env
        run: |
          set -euo pipefail
          cp .env.example .env
          python3 scripts/bootstrap_env.py

      - name: 渲染 compose
        run: docker compose config --quiet

      - name: 拒绝本地构建段
        run: |
          if docker compose config | grep -q 'build:'; then
            echo "::error::docker-compose.yml 里不允许出现 build: 段，本栈只拉取镜像。"
            exit 1
          fi

      - name: 确认缺少密码时会报错
        run: |
          set +e
          POSTGRES_PASSWORD= docker compose config --quiet 2>/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::没有 POSTGRES_PASSWORD 也能渲染通过，说明 :? 保护丢了。"
            exit 1
          fi
