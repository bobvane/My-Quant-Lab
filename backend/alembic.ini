[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# No `sqlalchemy.url` here on purpose: the URL comes from the application
# settings (POSTGRES_* / DATABASE_URL), because a second copy is a second answer,
# and alembic's ConfigParser interpolates `%`: a password with one in it used to
# raise `ValueError: invalid interpolation syntax` before connecting (ADR-098).

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
