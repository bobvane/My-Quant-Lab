[project]
name = "my-quant-lab"
version = "1.3.8"
description = "Personal quantitative research laboratory (NAS self-hosted, no auto trading)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
market-data = ["yfinance>=0.2.50"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    # starlette's TestClient prefers httpx2 and otherwise emits a deprecation
    # warning on every run that uses the `client` fixture. The application keeps
    # using httpx for its own HTTP calls (app/notifications, resource_monitor,
    # app/ai, ...), so this is test-only and does NOT replace the runtime client.
    "httpx2>=2.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
