# My Quant Lab — V1 production compose stack.
#
# 图形化 NAS 用法：在容器管理界面里选择本项目目录，直接使用本文件即可，
# 唯一需要你创建的文件是同目录下的 .env。
#
#   quantlab-web       Vue 3 UI (nginx, 代理 /api)
#   quantlab-api       FastAPI，启动时自动执行数据库迁移
#   quantlab-worker    Celery worker
#   quantlab-scheduler Celery beat（定时扫描信号）
#   quantlab-postgres  PostgreSQL（仅 backend 网络，不对外暴露）
#   quantlab-redis     Redis（仅 backend 网络，不对外暴露）
#
# 镜像策略（默认本地构建，不需要任何镜像仓库账号）
#   后端与前端都带 build: 段，`docker compose build` / 界面里的"构建"按钮
#   会在本机完成镜像构建，image 只是本地镜像的名字。
#
#   如果你想改用 GitHub Packages 上的预构建镜像（可选，需要仓库是私有的，
#   所以必须先 `docker login ghcr.io`），在 .env 里改这两行即可：
#
#       MQL_PULL_POLICY=always
#       MQL_BACKEND_IMAGE=ghcr.io/bobvane/my-quant-lab-backend:v0.0.6
#       MQL_WEB_IMAGE=ghcr.io/bobvane/my-quant-lab-web:v0.0.6
#
name: my-quant-lab

x-backend-image: &backend-image
  build:
    context: .
    dockerfile: docker/Dockerfile.backend
  image: ${MQL_BACKEND_IMAGE:-my-quant-lab-backend:local}
  pull_policy: ${MQL_PULL_POLICY:-never}

x-backend-env: &backend-env
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quantlab}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@quantlab-postgres:5432/${POSTGRES_DB:-quantlab}
  REDIS_URL: redis://quantlab-redis:6379/0
  CELERY_BROKER_URL: redis://quantlab-redis:6379/1
  CELERY_RESULT_BACKEND: redis://quantlab-redis:6379/2
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-synthetic}
  AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
  AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
  AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
  AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-2.0}
  GHOSTFOLIO_BASE_URL: ${GHOSTFOLIO_BASE_URL:-}
  GHOSTFOLIO_API_KEY: ${GHOSTFOLIO_API_KEY:-}
  DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:5173}

x-backend-networks: &backend-networks
  - backend

services:
  quantlab-postgres:
    image: postgres:16-alpine
    container_name: quantlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-quantlab}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantlab} -d ${POSTGRES_DB:-quantlab}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  quantlab-redis:
    image: redis:7-alpine
    container_name: quantlab-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  quantlab-api:
    <<: *backend-image
    container_name: quantlab-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      APP_ROLE: api
      PORT: "8080"
    ports:
      # bound to localhost only: the web container proxies /api
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      quantlab-postgres:
        condition: service_healthy
      quantlab-redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  quantlab-worker:
    <<: *backend-image
    container_name: quantlab-worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      APP_ROLE: worker
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    depends_on:
      quantlab-postgres:
        condition: service_healthy
      quantlab-redis:
        condition: service_healthy
      quantlab-api:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  quantlab-scheduler:
    <<: *backend-image
    container_name: quantlab-scheduler
    restart: unless-stopped
    environment:
      <<: *backend-env
      APP_ROLE: scheduler
    depends_on:
      quantlab-postgres:
        condition: service_healthy
      quantlab-redis:
        condition: service_healthy
      quantlab-api:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  quantlab-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: ${MQL_WEB_IMAGE:-my-quant-lab-web:local}
    pull_policy: ${MQL_PULL_POLICY:-never}
    container_name: quantlab-web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8081}:80"
    depends_on:
      quantlab-api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:

networks:
  frontend:
    name: quantlab-frontend
    driver: bridge
  backend:
    name: quantlab-backend
    driver: bridge
