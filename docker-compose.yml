# My Quant Lab — single-NAS stack
#
# Ten containers, one host, no message broker. Everything is pulled as a
# prebuilt image; nothing is compiled here.
#
#   1. cp .env.example .env      (fill in the three required secrets)
#   2. docker compose pull
#   3. docker compose up -d
#   4. http://<nas-ip>:8888
#
# Ports 5000/5432/6379 are bound to loopback on purpose: only the web port is
# meant to be reachable from the LAN.

x-runtime: &runtime
  init: true
  security_opt:
    - no-new-privileges:true
  pids_limit: ${CONTAINER_PIDS_LIMIT:-512}
  stop_grace_period: ${CONTAINER_STOP_GRACE_PERIOD:-45s}
  logging:
    driver: json-file
    options:
      max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
      max-file: ${CONTAINER_LOG_MAX_FILES:-5}

x-backend-image: &backend-image ${BACKEND_IMAGE:-ghcr.io/openbyteinc/quantdinger-backend}:${BACKEND_TAG:-5.6.1}

x-backend-env: &backend-env
  TZ: ${TZ:-Asia/Shanghai}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  DATABASE_URL: postgresql://${POSTGRES_USER:-quantdinger}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set it in .env}@postgres:5432/${POSTGRES_DB:-quantdinger}
  DB_TYPE: postgresql
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_CACHE_NAMESPACE: ${REDIS_CACHE_NAMESPACE:-mql:cache:v1}
  CACHE_ENABLED: "true"
  CELERY_TASKS_ENABLED: "true"
  CELERY_REDIS_HOST: redis-jobs
  CELERY_REDIS_PORT: 6379
  CELERY_REDIS_PASSWORD: ${CELERY_REDIS_PASSWORD:-}
  CELERY_BROKER_DB: 0
  CELERY_RESULT_DB: 1
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
  DB_POOL_MIN: ${WORKER_DB_POOL_MIN:-2}
  DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-12}
  DB_POOL_ACQUIRE_TIMEOUT: ${DB_POOL_ACQUIRE_TIMEOUT:-10}
  DB_POOL_HEALTH_CHECK: ${DB_POOL_HEALTH_CHECK:-true}
  DB_APPLICATION_NAME: mql-worker
  SKIP_AUTO_MIGRATE: "true"
  ALLOW_LOCAL_DESKTOP_BROKERS: ${ALLOW_LOCAL_DESKTOP_BROKERS:-true}
  MARKET_CATALOG_AUTO_SYNC: ${MARKET_CATALOG_AUTO_SYNC:-true}
  MARKET_CATALOG_SYNC_INTERVAL_SEC: ${MARKET_CATALOG_SYNC_INTERVAL_SEC:-86400}
  LIVE_TRADING_WS_ORDER_ENTRY: ${LIVE_TRADING_WS_ORDER_ENTRY:-true}
  LIVE_TRADING_WS_ORDER_CONNECT_TIMEOUT_SEC: ${LIVE_TRADING_WS_ORDER_CONNECT_TIMEOUT_SEC:-2.5}
  LIVE_TRADING_WS_ORDER_RESPONSE_TIMEOUT_SEC: ${LIVE_TRADING_WS_ORDER_RESPONSE_TIMEOUT_SEC:-4}
  LIVE_TRADING_WS_ORDER_IDLE_RECONNECT_SEC: ${LIVE_TRADING_WS_ORDER_IDLE_RECONNECT_SEC:-20}
  LIVE_TRADING_WS_ORDER_MAX_CONNECTIONS: ${LIVE_TRADING_WS_ORDER_MAX_CONNECTIONS:-64}
  # No message broker in this stack: publish and the distributed bar fan-out
  # stay off, so strategies are evaluated in-process by the trading worker.
  KAFKA_EVENT_PUBLISH_ENABLED: "false"
  STRATEGY_DISTRIBUTED_BAR_ENABLED: "false"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.3-alpine}
    container_name: mql-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantdinger}
      POSTGRES_USER: ${POSTGRES_USER:-quantdinger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set it in .env}
      PGDATA: ${POSTGRES_PGDATA:-/var/lib/postgresql/18/docker}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - "postgres"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-150}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-256MB}"
    volumes:
      - postgres_data:${POSTGRES_PGDATA:-/var/lib/postgresql/18/docker}
    ports:
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    networks:
      - mql-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantdinger} -d ${POSTGRES_DB:-quantdinger}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    container_name: mql-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then set -- --requirepass "$$REDIS_PASSWORD"; fi
        exec redis-server --maxmemory "${REDIS_CACHE_MAXMEMORY:-128mb}" --maxmemory-policy allkeys-lru "$$@"
    ports:
      - "${REDIS_BIND:-127.0.0.1:6379}:6379"
    networks:
      - mql-network
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Durable Celery broker. Kept apart from the disposable cache above.
  redis-jobs:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    container_name: mql-redis-jobs
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${CELERY_REDIS_PASSWORD:-}
    command:
      - sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then set -- --requirepass "$$REDIS_PASSWORD"; fi
        exec redis-server --appendonly yes --appendfsync everysec --save 60 1000 --maxmemory "${REDIS_JOBS_MAXMEMORY:-512mb}" --maxmemory-policy noeviction "$$@"
    volumes:
      - redis_jobs_data:/data
    networks:
      - mql-network
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema bootstrap. Runs to completion before the API starts.
  migration:
    <<: *runtime
    image: *backend-image
    container_name: mql-migration
    restart: "no"
    command: ["python", "-m", "app.commands.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - ./.env:/app/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quantdinger}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set it in .env}@postgres:5432/${POSTGRES_DB:-quantdinger}
      DB_TYPE: postgresql
      DB_POOL_MIN: 1
      DB_POOL_MAX: 2
      DB_APPLICATION_NAME: mql-migration
    networks:
      - mql-network

  backend:
    <<: *runtime
    image: *backend-image
    container_name: mql-api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-127.0.0.1:5000}:5000"
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      # Must exist as a *file* on the host before `up`, otherwise Docker creates
      # a directory here and shadows the container's /app/.env.
      - ./.env:/app/.env
    environment:
      - PYTHON_API_HOST=0.0.0.0
      - PYTHON_API_PORT=5000
      - INDICATOR_PREVIEW_DIR=/app/data/indicator_previews
      - GIT_TAG=${BACKEND_TAG:-5.6.1}
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quantdinger}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; set it in .env}@postgres:5432/${POSTGRES_DB:-quantdinger}
      - DB_TYPE=postgresql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_CACHE_NAMESPACE=${REDIS_CACHE_NAMESPACE:-mql:cache:v1}
      - CACHE_ENABLED=true
      - QD_PROCESS_ROLE=api
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - STRATEGY_COMMANDS_ENABLED=true
      - CELERY_TASKS_ENABLED=true
      - CELERY_REDIS_HOST=redis-jobs
      - CELERY_REDIS_PORT=6379
      - CELERY_REDIS_PASSWORD=${CELERY_REDIS_PASSWORD:-}
      - CELERY_BROKER_DB=0
      - CELERY_RESULT_DB=1
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-}
      - SKIP_AUTO_MIGRATE=true
      - DB_POOL_MIN=${DB_POOL_MIN:-2}
      - DB_POOL_MAX=${DB_POOL_MAX:-12}
      - DB_POOL_ACQUIRE_TIMEOUT=${DB_POOL_ACQUIRE_TIMEOUT:-10}
      - DB_POOL_HEALTH_CHECK=${DB_POOL_HEALTH_CHECK:-true}
      - DB_APPLICATION_NAME=mql-api
      - MARKET_EXECUTOR_WORKERS=${MARKET_EXECUTOR_WORKERS:-6}
      - PORTFOLIO_EXECUTOR_WORKERS=${PORTFOLIO_EXECUTOR_WORKERS:-3}
      - RESOURCE_FD_COOLDOWN_SEC=${RESOURCE_FD_COOLDOWN_SEC:-180}
      - PORTFOLIO_MONITOR_DUE_BATCH_LIMIT=${PORTFOLIO_MONITOR_DUE_BATCH_LIMIT:-5}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - ALLOW_LOCAL_DESKTOP_BROKERS=${ALLOW_LOCAL_DESKTOP_BROKERS:-true}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8888}
      - KAFKA_EVENT_PUBLISH_ENABLED=false
      - STRATEGY_DISTRIBUTED_BAR_ENABLED=false
    networks:
      - mql-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Strategy runtime: evaluates bars, records paper trades, applies commands.
  trading-worker:
    <<: *runtime
    image: *backend-image
    restart: unless-stopped
    command: ["python", "-m", "app.commands.trading_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - ./.env:/app/.env
    environment:
      <<: *backend-env
      QD_PROCESS_ROLE: trading
      STRATEGY_COMMANDS_ENABLED: "false"
      DB_POOL_MIN: ${TRADING_DB_POOL_MIN:-4}
      DB_POOL_MAX: ${TRADING_DB_POOL_MAX:-32}
      DB_APPLICATION_NAME: mql-trading
    networks:
      - mql-network
    healthcheck:
      test: ["CMD", "python", "-m", "app.commands.worker_health", "trading"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Portfolio monitor, order bookkeeping, market catalog sync.
  scheduler-worker:
    <<: *runtime
    image: *backend-image
    container_name: mql-scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.commands.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - ./.env:/app/.env
    environment:
      <<: *backend-env
      QD_PROCESS_ROLE: scheduler
      DB_APPLICATION_NAME: mql-scheduler
    networks:
      - mql-network
    healthcheck:
      test: ["CMD", "python", "-m", "app.commands.worker_health", "scheduler"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery-worker:
    <<: *runtime
    image: *backend-image
    container_name: mql-celery
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "jobs,ai,maintenance", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - ./.env:/app/.env
    environment:
      <<: *backend-env
      QD_PROCESS_ROLE: celery
      DB_APPLICATION_NAME: mql-celery
    networks:
      - mql-network
    healthcheck:
      test: ["CMD", "python", "-m", "app.commands.worker_health", "celery"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  celery-beat:
    <<: *runtime
    image: *backend-image
    container_name: mql-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/app/data/celerybeat-schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - ./.env:/app/.env
    environment:
      <<: *backend-env
      QD_PROCESS_ROLE: celery
      DB_APPLICATION_NAME: mql-beat
    networks:
      - mql-network
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/openbyteinc/quantdinger-frontend}:${FRONTEND_TAG:-5.6.1}
    container_name: mql-web
    restart: unless-stopped
    ports:
      # The only port that needs to be reachable from other devices.
      - "${FRONTEND_HOST:-0.0.0.0}:${FRONTEND_PORT:-8888}:80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000}
    depends_on:
      - backend
    networks:
      - mql-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  backend_logs:
  backend_data:
  redis_jobs_data:

networks:
  mql-network:
    driver: bridge
