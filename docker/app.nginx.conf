# My Quant Lab — the application container's complete nginx configuration.
#
# This file is a TEMPLATE. The entrypoint renders it to /tmp/quantlab-nginx.conf
# and starts nginx with `-c` that path, because the container runs as uid 10001
# and cannot rewrite anything under /etc/nginx:
#
#   ${AUTH_LINE}  ->  proxy_set_header Authorization "Bearer <API_AUTH_TOKEN>";
#                     (or nothing at all when the token is unset)
#
# The substitution is done by the entrypoint's three lines of Python, not by
# envsubst: this image deliberately does not carry gettext-base.
#
# Everything the old two-container layout did at the network level now happens on
# the container loopback: nginx listens on 8080 (unprivileged, so no
# CAP_NET_BIND_SERVICE and no root), uvicorn answers on 127.0.0.1:8000. The
# behaviours below are carried over unchanged from docker/web.nginx.conf:
# gzip, the hashed-asset 404 policy, the SPA no-cache fallback, the 300 s proxy
# read timeout, the bearer token on /api/, /docs and /openapi.json (ADR-103),
# the static /healthz and the empty favicon.
#
# Running unprivileged also means: pid and every temp path live under /tmp, and
# the logs go to the container's stdout/stderr so `docker compose logs` keeps
# showing them.

worker_processes 1;

pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 20m;

        # nginx defaults to "gzip off", which sent the 1.29 MB bundle to the
        # browser uncompressed (ADR-068).
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types application/javascript text/css application/json text/plain image/svg+xml;

        # Hashed assets may be cached until the heat death of the universe: their
        # name changes when their content does. A missing one is a plain 404
        # rather than the SPA fallback, because answering with index.html means a
        # page that asks for a bundle a newer deploy deleted receives HTML and
        # the browser reports a syntax error instead of a missing file
        # (ADR-068).
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Single-page app: unknown paths fall back to index.html. The shell
        # itself must be revalidated, or a browser keeps an old page that points
        # at assets which no longer exist.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # API reverse proxy. The upstream is the container's own uvicorn, which
        # is not reachable from outside the container.
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            # Injected at container start by the entrypoint when API_AUTH_TOKEN
            # is set; empty otherwise (the API is then open on the loopback only).
            ${AUTH_LINE}
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # The documentation surface is part of the API, so it presents the same
        # token the /api/ proxy does: a client that reaches the API port directly
        # cannot read the schema, while the browser still gets a working page
        # (ADR-103).
        location /docs {
            proxy_pass http://127.0.0.1:8000/docs;
            ${AUTH_LINE}
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:8000/openapi.json;
            ${AUTH_LINE}
            proxy_set_header Host $host;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # No .ico is shipped; index.html links favicon.svg. This exists so that a
        # client which asks anyway gets a definitive empty answer instead of the
        # application's HTML.
        location = /favicon.ico {
            access_log off;
            return 204;
        }
    }
}
