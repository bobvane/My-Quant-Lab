server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # nginx defaults to "gzip off", which sent the 1.29 MB bundle to the browser
    # uncompressed. The API already compresses its own responses; the app's own
    # assets should too (ADR-068).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript text/css application/json text/plain image/svg+xml;

    # Hashed assets may be cached until the heat death of the universe: their
    # name changes when their content does. A missing one is a plain 404 rather
    # than the SPA fallback, because answering with index.html means a page that
    # asks for a bundle a newer deploy deleted receives HTML and the browser
    # reports a syntax error instead of a missing file (ADR-068).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Single-page app: unknown paths fall back to index.html. The shell itself
    # must be revalidated, or a browser keeps an old page that points at assets
    # which no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://quantlab-api:8080/api/;
        proxy_http_version 1.1;
        # Injected at container start by web-entrypoint.sh when API_AUTH_TOKEN
        # is set; empty otherwise (the API is then open on the loopback only).
        ${AUTH_LINE}
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /docs {
        proxy_pass http://quantlab-api:8080/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://quantlab-api:8080/openapi.json;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # No .ico is shipped; index.html links favicon.svg. This exists so that a
    # client which asks anyway gets a definitive empty answer instead of the
    # application's HTML.
    location = /favicon.ico {
        access_log off;
        return 204;
    }
}
