server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://quantlab-api:8080/api/;
        proxy_http_version 1.1;
        # Injected at container start by web-entrypoint.sh when API_AUTH_TOKEN
        # is set; empty otherwise (the API is then open on the loopback only).
        ${AUTH_LINE}
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /docs {
        proxy_pass http://quantlab-api:8080/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://quantlab-api:8080/openapi.json;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
